<head>
  <title>
    {% if page.title == "Home" %}
      {{ site.title }} - {{ site.description }}
    {% else %}
      {{ page.title }} | {{ site.title }}
    {% endif %}
  </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.title == "Home" %}
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/logo_white.png">
    <meta property="og:image:secure_url" content="{{ site.url }}{{ site.baseurl }}/assets/img/logo_white.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="800">
    <meta property="og:image:alt" content="{{ site.title }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.title }}">
    <meta name="twitter:description" content="{{ site.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/logo_white.png">
  {% elsif page.image %}
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="article">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ page.image }}">
    <meta property="og:image:secure_url" content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ page.image }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="800">
    <meta property="og:image:alt" content="{{ page.title }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/{{ page.image }}">
  {% else %}
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="article">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/logo_white.png">
    <meta property="og:image:secure_url" content="{{ site.url }}{{ site.baseurl }}/assets/img/logo_white.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="800">
    <meta property="og:image:alt" content="{{ page.title }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/logo_white.png">
  {% endif %}
  <!-- Font Awesome early load to ensure icons are available -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css">
  <!-- Ensure dark mode toggle script runs as early as possible -->
  <script src="{{ site.github.url }}/assets/js/ensure-dark-mode.js"></script>
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/syntax.css">
  <!-- Custom CSS for fixes -->
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/custom.css">
  <!-- Special fixes for dark mode toggle visibility -->
  <link rel="stylesheet" href="{{ site.github.url }}/assets/css/dark-mode-fixes.css">
  <!-- Use Atom -->
  {% feed_meta %}
  <!-- RSS-v2.0
  <link href="{{ site.github.url }}/rss-feed.xml" type="application/rss+xml" rel="alternate" title="{{ site.title }} | {{ site.description }}"/>
  //-->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Source+Code+Pro">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&family=Scada&family=Tektur&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML">
  </script>
  <!-- Google Analytics -->
  {% include google-analytics.html %}
  <!-- Use Jekyll SEO plugin -->
  {% seo %}
  <!-- Dark Mode Script -->
  <script src="{{ site.github.url }}/assets/js/dark-mode.js"></script>
  <!-- WhatsApp Image Optimization -->
  <script src="{{ site.github.url }}/assets/js/image-processor.js"></script>
  
  <!-- Inline style for dark mode toggle as a last resort -->
  <style>
    /* Force moon icon visibility in all modes */
    #dark-mode-toggle,
    #dark-mode-toggle i.fa,
    #dark-mode-toggle i.fa-moon-o {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
    
    /* White moon in dark mode */
    body.dark-mode #dark-mode-toggle,
    body.dark-mode #dark-mode-toggle i.fa-moon-o {
      color: #ffffff !important;
    }
    
    /* Black moon in light mode */
    body:not(.dark-mode) #dark-mode-toggle,
    body:not(.dark-mode) #dark-mode-toggle i.fa-moon-o {
      color: #000000 !important;
    }
    
    /* Always show moon icon */
    .fa-moon-o:before {
      content: "\f186" !important;
      display: inline-block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  </style>
</head>
